# Braxy production stack (single host). See docs/deploy.md.
#
#   cp infra/prod.env.example .env.prod   # fill in the secrets
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build --wait
#
# Only the proxy (web) publishes ports. The backend is reachable through it
# alone: the rate limits trust the X-Forwarded-For the proxy writes.
name: ${COMPOSE_PROJECT_NAME:-braxy-prod}

x-backend-env: &backend-env
  APP_ENV: production
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE (saci secret)}
  # Per process; WEB_CONCURRENCY processes each open this many connections.
  DATABASE_URL: postgres://braxy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@pg:5432/braxy_production?initial_pool_size=${DB_POOL:-8}&max_idle_pool_size=${DB_POOL:-8}&max_pool_size=${DB_POOL:-8}&retry_delay=0.001
  REDIS_URL: redis://redis:6379/0
  APP_ORIGINS: https://${BRAXY_DOMAIN:?set BRAXY_DOMAIN}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
  # Heap budget per process for Saci::GCTuner (container limit / processes,
  # minus headroom for sockets and page tables).
  SACI_MEMORY_LIMIT: ${SACI_MEMORY_LIMIT:-}
  SACI_LOG_FORMAT: json
  # warn by default in production; info logs one JSON line per request.
  LOG_LEVEL: ${LOG_LEVEL:-warn}
  # Enables GET /metrics (Bearer token) on backend:3000, inside the network
  # only: the proxy does not route /metrics.
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # Password reset mails (config/initializers/mailer.cr).
  APP_URL: ${APP_URL:-}
  MAIL_DELIVERY: ${MAIL_DELIVERY:-smtp}
  MAIL_FROM: ${MAIL_FROM:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
  MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
  POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
  # Web push with Braxy closed; without the keys the option is hidden.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

x-backend-build: &backend-build
  context: ..
  dockerfile: infra/prod.Dockerfile
  target: backend
  additional_contexts:
    saci: ${SACI_CONTEXT:-https://github.com/pedrohvsouza/saci.git#master}

services:
  pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: braxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: braxy_production
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braxy -d braxy_production"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies pending migrations before the new backend starts.
  migrate:
    image: ${BRAXY_IMAGE:-braxy-prod:local}
    build: *backend-build
    environment: *backend-env
    entrypoint: ["/app/bin/saci-migrate"]
    command: ["up"]
    restart: "no"
    depends_on:
      pg: { condition: service_healthy }

  backend:
    image: ${BRAXY_IMAGE:-braxy-prod:local}
    build: *backend-build
    restart: unless-stopped
    init: true
    environment:
      <<: *backend-env
      SKIP_DB_PREPARE: "1"
    stop_grace_period: 20s
    ulimits:
      nofile: { soft: 200000, hard: 200000 }
    depends_on:
      migrate: { condition: service_completed_successfully }
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: ${BRAXY_WEB_IMAGE:-braxy-prod-web:local}
    build:
      context: ..
      dockerfile: infra/prod.Dockerfile
      target: web
      args:
        BRAXY_GIT_SHA: ${BRAXY_GIT_SHA:-dev}
    restart: unless-stopped
    environment:
      BRAXY_DOMAIN: ${BRAXY_DOMAIN:?set BRAXY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      BACKEND_ADDR: backend:3000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: { condition: service_healthy }

  # Nightly pg_dump (custom format) into the backups volume, keeping
  # BACKUP_KEEP_DAYS days. Copy that volume off the host (see docs/deploy.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: pg
      PGUSER: braxy
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: braxy_production
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup"]
    volumes:
      - ./pg-backup.sh:/usr/local/bin/pg-backup:ro
      - backups:/backups
    depends_on:
      pg: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  backups:
