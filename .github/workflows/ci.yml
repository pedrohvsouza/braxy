name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The backend uses Saci by path (`../../saci` from braxy/backend), so the two
# repositories are checked out side by side: $GITHUB_WORKSPACE/braxy and
# $GITHUB_WORKSPACE/saci. SACI_REF (a repository variable) pins the
# framework to a branch, tag or commit; master by default.
env:
  SACI_REF: ${{ vars.SACI_REF || 'master' }}

jobs:
  backend:
    name: Backend (crystal spec)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: braxy
          POSTGRES_PASSWORD: braxy
          POSTGRES_DB: braxy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U braxy -d braxy_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://braxy:braxy@localhost:5432/braxy_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: braxy/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: braxy
      - uses: actions/checkout@v4
        with:
          repository: pedrohvsouza/saci
          ref: ${{ env.SACI_REF }}
          path: saci
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22.0"
      - name: System libraries (sqlite3 is a Saci dependency)
        run: dpkg -s libsqlite3-dev >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev)
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: braxy/backend/lib
          key: shards-${{ runner.os }}-${{ hashFiles('braxy/backend/shard.lock', 'saci/shard.yml') }}
          restore-keys: shards-${{ runner.os }}-
      - name: Install shards
        run: shards install
      - name: Specs
        run: crystal spec

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright against the compose stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [backend, frontend]
    env:
      BRAXY_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: braxy
      - uses: actions/checkout@v4
        with:
          repository: pedrohvsouza/saci
          ref: ${{ env.SACI_REF }}
          path: saci
      - name: Start the stack (pg, redis, s3, backend, frontend)
        working-directory: braxy
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Wait for the frontend
        run: timeout 300 bash -c 'until curl -fsS http://localhost:5173/ >/dev/null && curl -fsS http://localhost:5173/up >/dev/null; do sleep 2; done'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: braxy/frontend/package-lock.json
      - name: Install test dependencies
        working-directory: braxy/frontend
        run: npm ci --no-audit --no-fund
      - name: Playwright version
        id: playwright
        working-directory: braxy/frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: braxy/frontend
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: braxy/frontend
        run: npx playwright install-deps chromium
      - name: Playwright
        working-directory: braxy/frontend
        run: npx playwright test
      - name: Stack logs
        if: failure()
        working-directory: braxy
        run: docker compose logs --no-color --tail 300 backend frontend
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: braxy/frontend/test-results
          retention-days: 7
